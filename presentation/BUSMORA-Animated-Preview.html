er complete it. Our focus is Arabic-first business owners. The experience you will see is an animated product concept.\n\nAnimation cues\nOpening: show the name. First click introduces direction and action. Second click identifies the audience. This is suggested pitch wording grounded in the product vision, not approved positioning or a measured outcome.\n\nSource reference\nBUSMORA product specification, version 2.0, 30 October 2026. §2 Product vision; §2.1 primary users; §2.2 owner jobs.\n\nPresentation basis\nThis pitch presents the planned product experience. Conceptual flows illustrate intended behavior, not a recording of a working product or a claim of achieved business results."}, {"title": "The next move is the hard part", "chapter": "The owner’s problem", "elements": [{"name": "brand", "type": "textbox", "x": 64, "y": 672, "w": 160, "h": 23, "fill": "none", "r": 0, "line": "none", "step": 0, "value": "BUSMORA", "size": 15, "color": "#42516B", "bold": true, "align": "left"}, {"name": "chapter", "type": "textbox", "x": 260, "y": 672, "w": 860, "h": 23, "fill": "none", "r": 0, "line": "none", "step": 0, "value": "The owner’s problem", "size": 15, "color": "#42516B", "bold": false, "align": "left"}, {"name": "number", "type": "textbox", "x": 1160, "y": 670, "w": 56, "h": 25, "fill": "none", "r": 0, "line": "none", "step": 0, "value": "02", "size": 18, "color": "#42516B", "bold": false, "align": "right"}, {"name": "title", "type": "textbox", "x": 64, "y": 57, "w": 1152, "h": 130, "fill": "none", "r": 0, "line": "none", "step": 0, "value": "The next move is the hard part", "size": 50, "color": "#171926", "bold": true, "align": "left"}, {"name": "question", "type": "textbox", "x": 64, "y": 225, "w": 1150, "h": 88, "fill": "none", "r": 0, "line": "none", "step": 0, "value": "“What should I do next?”", "size": 62, "color": "#171926", "bold": true, "align": "left"}, {"name": "choice-0", "type": "roundRect", "x": 64, "y": 361, "w": 368, "h": 143, "fill": "linear(25de demand or competitive superiority. The evidence to seek is whether owners accept useful work, return for another task, need less correction or explanation, and eventually show willingness to pay. No revenue, market size, or customer-success claim is made.\n\nAnimation cues\nThree clicks reveal the commercial logic. Give each card a short explanation rather than adding unsupported market numbers.\n\nSource reference\nBUSMORA product specification, version 2.0, 30 October 2026. §2 differentiation hypothesis; §2.1–2.3; §10.3 product measures; §12.2 commercial learning.\n\nPresentation basis\nThis pitch presents the planned product experience. Conceptual flows illustrate intended behavior, not a recording of a working product or a claim of achieved business results."}, {"title": "A focused first release, with room to grow", "chapter": "Product expansion", "elements": [{"name": "brand", "type": "textbox", "x": 64, "y": 672, "w": 160, "h": 23, "fill": "none", "r": 0, "line": "none", "step": 0, "value": "BUSMORA", "size": 15, "color": "#42516B", "bold": true, "align": "left"}, {"name": "chapter", "type": "textbox", "x": 260, "y": 672, "w": 860, "h": 23, "fill": "none", "r": 0, "line": "none", "step": 0, "value": "Product expansion", "size": 15, "color": "#42516B", "bold": false, "align": "left"}, {"name": "number", "type": "textbox", "x": 1160, "y": 670, "w": 56, "h": 25, "fill": "none", "r": 0, "line": "none", "step": 0, "value": "11", "size": 18, "color": "#42516B", "bold": false, "align": "right"}, {"name": "title", "type": "textbox", "x": 64, "y": 57, "w": 1152, "h": 130, "fill": "none", "r": 0, "line": "none", "step": 0, "value": "A focused first release, with room to grow", "size": 50, "color": "#171926", "bold": true, "align": "left"}, {"name": "scope-label", "type": "textbox", "x": 68, "y": 192, "w": 1100, "h": 31, "fill": "none", "r": 0, "line": "none", "step": 0, "value": "Planned release and future capabilities", "size": 21, "color": "#42516B", "bold": false, "align": "left"}, {"name": "initial", "type": "roundRect", "x": 64, "y": 268, "w": 561, "h": 353, "fill": "linear(0deg, #6437FC 0%, #8562F8 100%)", "r": 24, "line": "#FFFFFF", "step": 1}, {"name": "initial-title", "type": "textbox", "x": 92, "y": 295, "w": 505, "h": 80, "fill": "none", "r": 0, "line": "none", "step": 1, "value": "First release", "size": 31, "color": "#FFFFFF", "bold": true, "align": "left"}, {"name": "initial-body", "type": "textbox", "x": 92, "y": 380, "w": 505, "h": 228, "fill": "none", "r": 0, "line": "none", "step": 1, "value": "Business Brain, Chat and Roadmap.\nResearch, editable outputs and\napproved Facebook publishing.", "size": 25, "color": "#FFFFFF", "bold": false, "align": "left"}, {"name": "future-0", "type": "roundRect", "x": 655, "y": 268, "w": 561, "h": 109, "fill": "linear(25deg, #EDF0FD 0%, #FAFBFD 100%)", "r": 24, "line": "#FFFFFF", "step": 2}, {"name": "future-label-0", "type": "textbox", "x": 683, "y": 284, "w": 503, "h": 32, "fill": "none", "r": 0, "line": "none", "step": 2, "value": "Phase 3", "size": 24, "color": "#6437FC", "bold": true, "align": "left"}, {"name": "future-copy-0", "type": "textbox", "x": 683, "y": 320, "w": 503, "h": 54, "fill": "none", "r": 0, "line": "none", "step": 2, "value": "Social import, Instagram Business, X and connected analytics.", "size": 23, "color": "#42516B", "bold": false, "align": "left"}, {"name": "future-1", "type": "roundRect", "x": 655, "y": 390, "w": 561, "h": 109, "fill": "linear(25deg, #EDF0FD 0%, #FAFBFD 100%)", "r": 24, "line": "#FFFFFF", "step": 3}, {"name": "future-label-1", "type": "textbox", "x": 683, "y": 406, "w": 503, "h": 32, "fill": "none", "r": 0, "line": "none", "step": 3, "value": "Phase 4+", "size": 24, "color": "#6437FC", "bold": true, "align": "left"}, {"name": "future-copy-1", "type": "textbox", "x": 683, "y": 442, "w": 503, "h": 54, "fill": "none", "r": 0, "line": "none", "step": 3, "value": "AI image generation and later billing.", "size": 23, "color": "#42516B", "bold": false, "align": "left"}, {"name": "future-2", "type": "roundRect", "x": 655, "y": 512, "w": 561, "h": 109, "fill": "linear(25deg, #EDF0FD 0%, #FAFBFD 100%)", "r": 24, "line": "#FFFFFF", "step": 4}, {"name": "future-label-2", "type": "textbox", "x": 683, "y": 528, "w": 503, "h": 32, "fill": "none", "r": 0, "line": "none", "step": 4, "value": "Phase 5", "size": 24, "color": "#6437FC", "bold": true, "align": "left"}, {"name": "future-copy-2", "type": "textbox", "x": 683, "y": 564, "w": 503, "h": 54, "fill": "none", "r": 0, "line": "none", "step": 4, "value": "Meta Ads management with spending approval.", "size": 23, "color": "#42516B", "bold": false, "align": "left"}], "concept": false, "notes": "Speaker notes\nThe initial product vision has a bounded first production-ready release, called Phase 2 in the development plan. It includes the core owner journey, task visibility, research, documents, supported requested file analysis, and governed Facebook publishing. Later phases broaden input and publishing reach, add authorized connected analytics, introduce image generation and billing, and eventually support paid Meta Ads management. These are planned capabilities, not a statement of current availability. No launch date, pricing, or later-phase delivery capacity is assumed. Phase 3’s Instagram Business and X capabilities include publishing.\n\nAnimation cues\nClick 1 establishes the core release. Clicks 2–4 reveal expansion in order. Keep future capabilities visually separate from the initial release.\n\nSource reference\nBUSMORA product specification, version 2.0, 30 October 2026. §3 phase plan and release contract; §3.2; §6.1–6.4; §12.1.\n\nPresentation basis\nThis pitch presents the planned product experience. Conceptual flows illustrate intended behavior, not a recording of a working product or a claim of achieved business results."}, {"title": "The ambition", "chapter": "BUSMORA / Product vision", "elements": [{"name": "brand", "type": "textbox", "x": 64, "y": 672, "w": 160, "h": 23, "fill": "none", "r": 0, "line": "none", "step": 0, "value": "BUSMORA", "size": 15, "color": "#42516B", "bold": true, "align": "left"}, {"name": "chapter", "type": "textbox", "x": 260, "y": 672, "w": 860, "h": 23, "fill": "none", "r": 0, "line": "none", "step": 0, "value": "BUSMORA / Product vision", "size": 15, "color": "#42516B", "bold": false, "align": "left"}, {"name": "number", "type": "textbox", "x": 1160, "y": 670, "w": 56, "h": 25, "fill": "none", "r": 0, "line": "none", "step": 0, "value": "12", "size": 18, "color": "#42516B", "bold": false, "align": "right"}, {"name": "closing-label", "type": "textbox", "x": 68, "y": 80, "w": 1100, "h": 33, "fill": "none", "r": 0, "line": "none", "step": 0, "value": "THE AMBITION", "size": 21, "color": "#6437FC", "bold": true, "align": "left"}, {"name": "closing-name", "type": "textbox", "x": 60, "y": 160, "w": 1150, "h": 142, "fill": "none", "r": 0, "line": "none", "step": 0, "value": "BUSMORA", "size": 112, "color": "#171926", "bold": true, "align": "left"}, {"name": "closing-line", "type": "textbox", "x": 68, "y": 338, "w": 1110, "h": 172, "fill": "none", "r": 0, "line": "none", "step": 1, "value": "An AI Marketing Director\nan owner can actually use.", "size": 61, "color": "#171926", "bold": true, "align": "left"}, {"name": "closing-card", "type": "roundRect", "x": 64, "y": 554, "w": 1152, "h": 75, "fill": "linear(0deg, #6437FC 0%, #8562F8 100%)", "r": 19, "line": "#FFFFFF", "step": 2}, {"name": "closing-summary", "type": "textbox", "x": 92, "y": 573, "w": 1095, "h": 45, "fill": "none", "r": 0, "line": "none", "step": 2, "value": "Understand the business. Help the owner act.", "size": 32, "color": "#FFFFFF", "bold": true, "align": "center"}], "concept": false, "notes": "Speaker notes\nBUSMORA’s ambition is to connect business understanding with useful marketing action in an experience an Arabic-first owner can use. The product opportunity is the complete relationship: context that continues across tasks, judgment grounded in available evidence, and work the owner can inspect and authorize. That is the idea we want the judges to evaluate. We do not need to claim guaranteed growth to make that ambition worthwhile.\n\nAnimation cues\nFirst click reveals the ambition. Second click closes with the suggested pitch message. Allow the final composition to remain on screen for questions.\n\nSource reference\nBUSMORA product specification, version 2.0, 30 October 2026. §2 product vision; §2.2–2.3 owner jobs and principles; §12.2 commercial learning.\n\nPresentation basis\nThis pitch presents the planned product experience. Conceptual flows illustrate intended behavior, not a recording of a working product or a claim of achieved business results."}];
const stage=document.getElementById('stage'),frame=document.getElementById('frame');
let index=0,step=0,timer=null;
function maxStep(){return Math.max(0,...slides[index].elements.map(e=>e.step))}
function background(fill){return fill==='none'?'transparent':fill.startsWith('linear(')?fill.replace('linear(','linear-gradient('):fill}
function resize(){let v=document.getElementById('viewport'),scale=Math.min((v.clientWidth-32)/1280,(v.clientHeight-32)/720);frame.style.width=1280*scale+'px';frame.style.height=720*scale+'px';stage.style.transform='scale('+scale+')'}
function draw(){stage.replaceChildren();stage.setAttribute('aria-label',slides[index].title);slides[index].elements.forEach(e=>{let node=document.createElement('div');node.className='el'+(e.step?' animated':'')+(e.type==='line'?' line'+(e.w===0?' vertical':''):'');node.dataset.step=e.step;node.dataset.name=e.name;Object.assign(node.style,{left:e.x+'px',top:e.y+'px',width:(e.type==='line'&&e.w===0?2:e.w)+'px',height:(e.type==='line'&&e.h===0?2:e.h)+'px',background:background(e.type==='line'?e.line:e.fill),borderRadius:e.r+'px'});if(e.type!=='line'&&e.line!=='none')node.style.border='1.4px solid '+e.line;if(e.value!==undefined){node.textContent=e.value;Object.assign(node.style,{fontSize:e.size+'px',fontWeight:e.bold?'700':'400',color:e.color,textAlign:e.align});}stage.append(node)});update();resize()}
function update(){stage.querySelectorAll('[data-step]').forEach(n=>n.classList.toggle('on',Number(n.dataset.step)<=step));document.getElementById('progress').textContent=(index+1)+' / '+slides.length+'   ·   '+step+' / '+maxStep()+' builds';document.getElementById('notes').textContent=slides[index].notes;document.getElementById('live').textContent='Slide '+(index+1)+': '+slides[index].title+', build '+step;document.getElementById('back').disabled=index===0&&step===0;}
function next(){if(step<maxStep()){step++;update()}else if(index<slides.length-1){index++;step=0;draw()}else stop()}
function back(){if(step>0){step--;update()}else if(index>0){index--;step=maxStep();draw()}}
function stop(){clearInterval(timer);timer=null;document.getElementById('play').textContent='Auto-play'}
document.getElementById('next').onclick=next;document.getElementById('back').onclick=back;stage.onclick=next;
document.getElementById('play').onclick=()=>{if(timer)stop();else{document.getElementById('play').textContent='Pause';timer=setInterval(next,3000);next()}};
document.getElementById('notes-button').onclick=()=>{document.getElementById('notes').hidden=!document.getElementById('notes').hidden};
document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()};
document.addEventListener('keydown',e=>{if([' ','ArrowRight','PageDown'].includes(e.key)){e.preventDefault();next()}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();back()}if(e.key==='Home'){index=0;step=0;draw()}if(e.key==='End'){index=slides.length-1;step=maxStep();draw()}});
window.addEventListener('resize',resize);draw();
window.presentationTest={go:(i,s=0)=>{index=i;step=s;draw()},state:()=>({index,step,max:maxStep()})};
</script></body></html>
